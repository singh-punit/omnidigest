<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="od-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="od-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="od-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="32" fill="url(#od-bg-grad)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="30.5" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Podcast & Intelligence Wave Group -->
  <g transform="translate(64, 60)">
    <!-- Concentric Broadcast Waves -->
    <path d="M -36 -12 A 40 40 0 0 1 36 -12" fill="none" stroke="url(#od-core-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.4" />
    <path d="M -26 -6 A 28 28 0 0 1 26 -6" fill="none" stroke="url(#od-core-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    
    <!-- Central Studio Capsule / Mic -->
    <rect x="-12" y="-22" width="24" height="38" rx="12" fill="url(#od-core-grad)" filter="url(#od-glow)" />
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="0" cy="4" r="2.5" fill="#ffffff" filter="url(#od-glow)" />

    <!-- Mic Cradle -->
    <path d="M -18 2 C -18 16 18 16 18 2" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="16" x2="0" y2="30" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>

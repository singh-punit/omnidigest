services:
  omnidigest:
    build: .
    container_name: omnidigest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
    ports:
      - "8099:8080"
    environment:
      - TZ=Australia/Sydney
      - DATA_DIR=/app/data
      - PODCAST_DIR=/app/data/podcasts
      - LLM_API_BASE=http://llama-server-qwen:8080/v1
      - LLM_MODEL=qwen2.5
      - NTFY_URL=http://ntfy:80/homelab-alerts
      - PUBLIC_BASE_URL=http://192.168.0.65:8099
      - SCHEDULE_HOUR=7
      - SCHEDULE_MINUTE=0
    volumes:
      - /srv/omnidigest/data:/app/data
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: punit_proxy-net
    external: true
